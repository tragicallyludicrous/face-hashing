<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Hashing — output viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    model-viewer {
      width: 100%;
      height: 70vh;
      background: linear-gradient(180deg, #222, #111);
      --poster-color: transparent;
    }
    h1 { font-weight: 300; }
    label { display: block; margin: 1rem 0 0.5rem; }
    select { padding: 0.4rem; background: #222; color: #eee; border: 1px solid #444; }
    #status { color: #888; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Face Hashing — output viewer</h1>
    <label for="model-select">Mesh (local/out):</label>
    <select id="model-select"></select>
    <model-viewer
      id="viewer"
      camera-controls
      interaction-prompt="none"
      shadow-intensity="1"
      exposure="1.1"
      camera-orbit="0deg 75deg auto"
      alt="Reconstructed 3D face"
    ></model-viewer>
    <p id="status">Loading model list…</p>
  </main>
  <script>
    const sel = document.getElementById('model-select');
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    // Keep the viewpoint fixed across model switches so faces compare at the same angle.
    // (<stem>_shape.glb is the neutral/un-posed identity; <stem>_composed.glb carries the photo's
    //  expression+pose — so the shape ones are the apples-to-apples identity comparison.)
    let savedOrbit = null;
    viewer.addEventListener('camera-change', () => { savedOrbit = viewer.getCameraOrbit(); });
    viewer.addEventListener('load', () => {
      if (savedOrbit) {
        viewer.cameraOrbit = `${savedOrbit.theta}rad ${savedOrbit.phi}rad ${savedOrbit.radius}m`;
        viewer.jumpCameraToGoal();
      }
    });
    sel.addEventListener('change', e => { viewer.src = e.target.value; });

    // Read the pipeline outputs straight from local/out (a sibling of viewer/), so you don't have to
    // copy .glbs anywhere. local/out is nested (out/<stem>/<stem>_{shape,composed}.glb), so we walk
    // the static server's directory listings recursively. REQUIRES serving from the repo ROOT:
    //   python3 -m http.server 8080      # then open http://localhost:8080/viewer/
    const OUT = new URL('../local/out/', location.href);   // out/ lives next to viewer/

    async function listDir(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      return [...doc.querySelectorAll('a')].map(a => a.getAttribute('href')).filter(Boolean);
    }

    async function collectGlbs(url, depth, acc) {
      if (depth > 4) return;                                // guard against deep/looping trees
      let hrefs;
      try { hrefs = await listDir(url); } catch { return; }
      for (const h of hrefs) {
        if (h.startsWith('?') || h.startsWith('/') || h === '../') continue;   // sort/parent links
        if (h.toLowerCase().endsWith('.glb')) acc.push(new URL(h, url).href);
        else if (h.endsWith('/')) await collectGlbs(new URL(h, url), depth + 1, acc);
      }
    }

    async function loadModelList() {
      try {
        const acc = [];
        await collectGlbs(OUT, 0, acc);
        acc.sort();                                  // groups each stem's _composed and _shape together
        if (!acc.length) {
          status.textContent = 'No .glb under local/out/ — run the pipeline (local/run.py), then reload.';
          return;
        }
        sel.innerHTML = '';
        for (const href of acc) {
          const opt = document.createElement('option');
          opt.value = href;
          opt.textContent = decodeURIComponent(href.split('/').pop()).replace(/\.glb$/i, '');
          sel.appendChild(opt);
        }
        viewer.src = sel.value;                      // load the first
        status.textContent = acc.length + ' mesh(es) in local/out/.';
      } catch (err) {
        status.textContent = 'Could not read local/out/ (' + err.message +
          '). Serve from the repo ROOT — `python3 -m http.server 8080`, then open /viewer/ (not file://, not from viewer/).';
      }
    }
    loadModelList();
  </script>
</body>
</html>
