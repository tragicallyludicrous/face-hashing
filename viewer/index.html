<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Hashing — Stage 1 viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    model-viewer {
      width: 100%;
      height: 70vh;
      background: linear-gradient(180deg, #222, #111);
      --poster-color: transparent;
    }
    h1 { font-weight: 300; }
    label { display: block; margin: 1rem 0 0.5rem; }
    select { padding: 0.4rem; background: #222; color: #eee; border: 1px solid #444; }
    #status { color: #888; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Face Hashing — Stage 1</h1>
    <label for="model-select">Model:</label>
    <select id="model-select"></select>
    <model-viewer
      id="viewer"
      camera-controls
      interaction-prompt="none"
      shadow-intensity="1"
      exposure="1.1"
      camera-orbit="0deg 75deg auto"
      alt="Reconstructed 3D face"
    ></model-viewer>
    <p id="status">Loading model list…</p>
  </main>
  <script>
    const sel = document.getElementById('model-select');
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    // Keep the viewpoint fixed across model switches so faces compare at the same angle.
    // (The mesh's own orientation still depends on how it was exported — use neutral .glbs,
    //  e.g. a neutral export from mica_local, for a true apples-to-apples shape comparison.)
    let savedOrbit = null;
    viewer.addEventListener('camera-change', () => { savedOrbit = viewer.getCameraOrbit(); });
    viewer.addEventListener('load', () => {
      if (savedOrbit) {
        viewer.cameraOrbit = `${savedOrbit.theta}rad ${savedOrbit.phi}rad ${savedOrbit.radius}m`;
        viewer.jumpCameraToGoal();
      }
    });
    sel.addEventListener('change', e => { viewer.src = e.target.value; });

    // Auto-discover every .glb in models/ by parsing the directory listing the static server
    // returns. Works whether the server emits relative ("foo.glb") or absolute
    // ("/viewer/models/foo.glb") hrefs — we resolve each against the models/ base URL.
    async function loadModelList() {
      try {
        const base = new URL('models/', location.href);   // absolute URL of the models dir
        const res = await fetch(base);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const hrefs = [...doc.querySelectorAll('a')]
          .map(a => a.getAttribute('href'))
          .filter(h => h && h.toLowerCase().endsWith('.glb'))
          .sort();                                  // keeps <name> and <name>_tweaked adjacent
        if (!hrefs.length) {
          status.textContent = 'No .glb files in viewer/models/ — copy one in and reload.';
          return;
        }
        sel.innerHTML = '';
        for (const href of hrefs) {
          const opt = document.createElement('option');
          opt.value = new URL(href, base).href;     // resolves relative OR absolute hrefs correctly
          const name = decodeURIComponent(href.split('/').pop());  // filename only, for the label
          opt.textContent = name.replace(/\.glb$/i, '');
          sel.appendChild(opt);
        }
        viewer.src = sel.value;                     // load the first
        status.textContent = hrefs.length + ' model(s) found.';
      } catch (err) {
        status.textContent = 'Could not list models/ (' + err.message +
          '). Serve over http — `cd viewer && python3 -m http.server 8080` — not file://.';
      }
    }
    loadModelList();
  </script>
</body>
</html>
